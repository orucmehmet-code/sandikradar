name: deploy-pages

# docs/ klasörünü GitHub Pages'e yayınlar (Settings → Pages → Source: GitHub Actions).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Pages ayarları
        uses: actions/configure-pages@v5

      - name: Artefaktı yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
